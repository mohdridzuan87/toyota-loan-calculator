<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="chk" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="skewX(-20)">
      <rect width="12" height="12" fill="#fff"/><rect x="12" y="12" width="12" height="12" fill="#fff"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
    <mask id="fm"><rect x="300" y="36" width="180" height="96" fill="url(#fade)"/></mask>
    <clipPath id="r"><rect width="512" height="512"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#0b0b0d"/>
    <!-- corak checker ala bendera lumba -->
    <rect x="300" y="36" width="180" height="96" fill="url(#chk)" mask="url(#fm)" opacity=".55"/>
    <!-- jalur serong merah / putih -->
    <polygon points="-40,512 120,420 512,420 512,452 150,452 20,512" fill="#eb0a1e"/>
    <polygon points="40,512 165,462 512,462 512,476 190,476 90,512" fill="#fff"/>
    <polygon points="110,512 205,486 512,486 512,512" fill="#eb0a1e"/>
  </g>
  <g font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900" font-style="italic">
    <text x="52" y="118" font-size="50" fill="#fff" letter-spacing="2">TOYOTA</text>
    <rect x="52" y="134" width="120" height="10" fill="#eb0a1e" transform="skewX(-20) translate(48 0)"/>
    <text x="40" y="272" font-size="138" fill="#fff" letter-spacing="-4">LOAN</text>
    <text x="48" y="352" font-size="50" fill="#eb0a1e" letter-spacing="1">WAN JASNI</text>
  </g>
</svg>
