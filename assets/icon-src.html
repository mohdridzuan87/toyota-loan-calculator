<!doctype html>
<!-- Sumber ikon app: render ke PNG dengan Chrome headless (lihat README). Gaya lencana serong hitam|merah (inspirasi GR). -->
<html><head><meta charset="utf-8"><style>
  /* Letak fail fon di assets/fonts/MonsterClubhouse.ttf untuk guna fon sebenar; jika tiada, guna fon sandaran */
  @font-face { font-family: "Monster Clubhouse"; src: url("fonts/MonsterClubhouse.ttf"), url("fonts/MonsterClubhouse.otf"); }
  html, body { margin: 0; background: #fff; }
  svg { display: block; width: 100vw; height: 100vh; }
</style></head><body>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#fff"/>
  <!-- TOYOTA -->
  <text x="96" y="122" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-style="italic" font-size="52" fill="#111" letter-spacing="3">TOYOTA</text>
  <!-- lencana serong: hitam | merah -->
  <polygon points="36,378 104,146 286,146 218,378" fill="#111"/>
  <polygon points="218,378 286,146 476,146 408,378" fill="#eb0a1e"/>
  <text x="256" y="302" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-style="italic" font-size="112" fill="#fff" letter-spacing="-2" textLength="330" lengthAdjust="spacingAndGlyphs">LOAN</text>
  <!-- WAN JASNI -->
  <text x="256" y="462" text-anchor="middle" font-family="'Monster Clubhouse', 'Arial Black', Arial, sans-serif" font-weight="900" font-style="italic" font-size="62" fill="#eb0a1e" letter-spacing="2">WAN JASNI</text>
</svg>
</body></html>
