name: Kemas kini harga & rebate Toyota

on:
  schedule:
    - cron: "0 1 1,15 * *"   # 1hb & 15hb setiap bulan, 9:00 pagi waktu Malaysia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Harga (price-list)
        run: node scripts/update-prices.mjs
      - name: Warna (laman model)
        run: node scripts/update-colours.mjs
      - name: Semak PDF harga warna (versi baharu?)
        run: node scripts/check-colour-pdfs.mjs
      - name: Rebate (monthly-promo)
        run: node scripts/update-rebates.mjs
      - name: PDF MaxCheck & senarai harga
        run: node scripts/update-docs.mjs
      - name: Commit jika berubah
        run: |
          if git diff --quiet -- prices.json rebates.json colours.json colour-prices.json docs.json assets/cars/col; then echo "Tiada perubahan"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json rebates.json colours.json colour-prices.json docs.json assets/cars/col
          git commit -m "Harga, rebate & warna Toyota dikemas kini automatik"
          git push
