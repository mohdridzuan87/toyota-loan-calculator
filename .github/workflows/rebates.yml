name: Kemas kini rebate Toyota

on:
  schedule:
    - cron: "0 1 * * *"   # setiap hari 9:00 pagi waktu Malaysia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-rebates.mjs
      - name: Commit jika berubah
        run: |
          if git diff --quiet -- rebates.json; then echo "Tiada perubahan"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebates.json
          git commit -m "Rebate Toyota dikemas kini automatik"
          git push
