name: Kemas kini poster promosi Toyota

on:
  schedule:
    - cron: "30 1 */3 * *"   # setiap 3 hari, 9:30 pagi waktu Malaysia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/update-promos.mjs
      - name: Commit jika berubah
        run: |
          git add -A promos.json assets/promo
          if git diff --cached --quiet; then echo "Tiada perubahan"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Poster promosi Toyota dikemas kini automatik"
          git push
